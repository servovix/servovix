<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão | ServoVIX</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0F17">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
<link rel="stylesheet" href="/assets/css/servovix.css">
<style>
  .off{min-height:100vh;display:grid;place-items:center;text-align:center}
  .off .wrap{max-width:620px}
  .off .ico{width:84px;height:84px;margin:0 auto 26px;border-radius:24px;display:grid;place-items:center;
    background:rgba(255,179,0,.12);border:1px solid rgba(255,179,0,.34)}
  .off .ico svg{width:40px;height:40px;color:var(--amber)}
  .off .btn-row{justify-content:center;margin-top:30px}
  .off .aviso-orcamento{margin-inline:auto}
</style>
</head>
<body>
<section class="off sec--dark mesh">
  <div class="wrap">
    <img src="/assets/brand/servovix-logo.svg" alt="ServoVIX — Instalações e Manutenções"
         width="292" height="84" style="height:74px;width:auto;margin:0 auto 30px">

    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 3.2-2.1M19 12.9a10 10 0 0 0-5.9-2.85M1.4 9.4a15 15 0 0 1 4.2-2.7M22.6 9.4A15 15 0 0 0 12 5.5"/>
        <circle cx="12" cy="20" r=".6" fill="currentColor"/>
      </svg>
    </div>

    <h1 class="h2">Você está<br>sem conexão</h1>
    <p class="lead" style="margin:18px auto 0">Esta página ainda não tinha sido aberta neste aparelho, por isso
      não está salva para uso offline. Assim que a internet voltar, ela carrega normalmente.</p>

    <div class="btn-row">
      <button class="btn btn--primary" onclick="location.reload()">Tentar de novo</button>
      <a class="btn btn--ghost" href="/">Ir para o início</a>
    </div>

    <p class="aviso-orcamento" style="margin-top:32px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92"/>
      </svg>
      <span><b>Precisa falar agora?</b> Ligue para (27) 99843-2920 — a chamada funciona mesmo sem internet.</span>
    </p>
  </div>
</section>
</body>
</html>
